name: Quality Checks
on:
  workflow_call:
    inputs:
      sln-path:
        description: Project path
        type: string
        default: '.'
      dotnet-version:
        description: .Net Version
        required: true
        type: string
    secrets:
      ci-github-token:
        required: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
      HUSKY: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Conventional Commits Check
        uses: amannn/action-semantic-pull-request@v5
        # Only run on pull request events
        if: github.event_name == 'pull_request'
        id: check-pull-request-title-conventional-commits
        env:
          GITHUB_TOKEN: ${{ secrets.ci-github-token }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '.config/dotnet-tools.json', 'global.json') }}

      # https://learn.microsoft.com/en-us/dotnet/core/tools/global-tools
      - name: Restore .NET Tools
        shell: bash
        run: dotnet tool restore

      - name: Validate formatting
        if: success()
        shell: bash
        run: dotnet csharpier --check .

      - name: Validate style
        if: success()
        shell: bash
        run: dotnet format style food-delivery-microservices.slnx --verify-no-changes --severity error --verbosity diagnostic

      - name: Run analyzers
        if: success()
        shell: bash
        run: NuGetAudit=false dotnet format analyzers food-delivery-microservices.slnx --verify-no-changes --severity error --verbosity diagnostic --exclude src/Aspire/FoodDelivery.AppHost

      - name: Run Gitleaks secret scan
        if: success()
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.ci-github-token }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Lint Dockerfiles
        if: success()
        shell: bash
        run: sh scripts/lint-dockerfiles.sh
