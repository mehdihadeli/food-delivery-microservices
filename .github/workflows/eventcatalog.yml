name: Deploy EventCatalog to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/eventcatalog/**'
      - '.github/workflows/eventcatalog.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build EventCatalog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/eventcatalog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/eventcatalog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          BASE: '/food-delivery-microservices'
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/eventcatalog/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
